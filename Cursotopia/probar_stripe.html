<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Stripe</title>
    <style>
        body { font-family: Arial; background: #0b1f15; color: white; padding: 40px; text-align: center; }
        button { background: #00d26a; color: black; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        pre { background: #112e20; padding: 20px; text-align: left; border-radius: 5px; margin-top: 20px; color: #00d26a; }
    </style>
</head>
<body>
    <h1>Prueba de API de Terceros (Stripe)</h1>
    <p>Haz clic en el botón para simular el pago de un curso y comprobar la respuesta en formato JSON:</p>
    <button onclick="probarPago()">Probar Pago con Stripe</button>
    <pre id="resultado">Esperando respuesta de la API...</pre>

    <script>
        function probarPago() {
            fetch('http://localhost/Cursotopia/api.php?action=pago-stripe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ monto: 450.00, curso_id: 101 })
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('resultado').innerText = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                document.getElementById('resultado').innerText = 'Error: ' + err;
            });
        }
    </script>
</body>
</html>
