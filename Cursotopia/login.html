<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Cursotopia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a class="brand" href="index.html"><span class="brand-mark">C</span>Cursotopia</a>
    </div>
  </nav>

  <main class="auth-page">
    <form class="auth-card" id="login-form" onsubmit="return validarLogin(event)">
      <h1>Acceso</h1>
      <hr>
      <div class="field">
        <label for="login-email">Correo electrónico</label>
        <input id="login-email" type="email" required placeholder="correo@ejemplo.com">
      </div>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <input id="login-password" type="password" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary full" type="submit">Entrar</button>
      <span id="mensaje-error-login" class="error-msg"></span>
      <div class="auth-footer">
        ¿Aún no tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>
    </form>
  </main>

  <script src="js/validaciones.js"></script>
</body>
</html>
